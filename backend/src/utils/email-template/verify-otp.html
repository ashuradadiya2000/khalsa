<!DOCTYPE html>

    <title>Your OTP Code</title>
</head>
<body>
    <div style="font-family: Arial, sans-serif; line-height: 1.6; color: #333333; max-width: 600px; margin: 0 auto; padding: 0; border: 2px solid #f5f5f5; text-align: center; border-radius: 8px; overflow: hidden;">
        <div style="text-align: center; background-color: #4f46e5;">
            <h2 style="margin-top: 0; color: #fff; padding: 16px 8px;">Your OTP Code</h2>
        </div>
        <p style="margin: 0;">Your One-Time Password (OTP) for account verification is:</p>
        <div style="font-size: 24px; font-weight: bold; text-align: center; letter-spacing: 2px; margin: 20px 0; padding: 8px 15px; background-color: #f5f5f5; border-radius: 5px; display: inline-block;">{{OTP}}</div>
        <p style="margin: 0;">Please do not share this code with anyone.</p>
        <div style="margin-top: 16px;">
            <p>If you didn't request this code, please ignore this email.</p>
        </div>
        <p style="padding-bottom: 16px;">Thank you for using our service!</p>
    </div>
</body>
